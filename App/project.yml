name: BiteWindow
options:
  bundleIdPrefix: com.dautovri
  deploymentTarget:
    iOS: "17.0"
packages:
  BiteCore:
    path: ..
targets:
  BiteWindow:
    type: application
    platform: iOS
    # receipts/: local tool logs that must never ship in the bundle.
    sources:
      - path: BiteWindow
        excludes: ["receipts/**", "**/receipts.jsonl"]
    dependencies:
      - package: BiteCore
    scheme:
      testTargets: []
      storeKitConfiguration: BiteWindow.storekit
    preBuildScripts:
      - name: Block release builds on sample weather
        basedOnDependencyAnalysis: false
        script: |
          # Debug runs on sample weather; a Release build (archive) must point at the deployed worker.
          if [ "$CONFIGURATION" = "Release" ] && /usr/libexec/PlistBuddy -c "Print :BiteAPIBase" "$SRCROOT/BiteWindow/Info.plist" | grep -q REPLACE; then
            echo "error: BiteAPIBase in App/project.yml is still the placeholder. Deploy backend/ and set the worker URL before a Release build."
            exit 1
          fi
    info:
      path: BiteWindow/Info.plist
      properties:
        CFBundleDisplayName: BiteCurve
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.dautovri.bitecurve.refresh
        NSMotionUsageDescription: Reads your phone's barometer to track the live pressure trend at your spot.
        # Weather cache worker (see backend/). Set to a URL containing REPLACE to run on sample weather.
        BiteAPIBase: https://bitewindow-wx.dautov.workers.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dautovri.bitecurve
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
