name: BiteWindow
options:
  bundleIdPrefix: com.dautovri
  deploymentTarget:
    iOS: "17.0"
packages:
  BiteCore:
    path: ..
targets:
  BiteWindow:
    type: application
    platform: iOS
    sources:
      - BiteWindow
    dependencies:
      - package: BiteCore
    scheme:
      testTargets: []
    preBuildScripts:
      - name: Block release builds on sample weather
        basedOnDependencyAnalysis: false
        script: |
          # Debug runs on sample weather; a Release build (archive) must point at the deployed worker.
          if [ "$CONFIGURATION" = "Release" ] && /usr/libexec/PlistBuddy -c "Print :BiteAPIBase" "$SRCROOT/BiteWindow/Info.plist" | grep -q REPLACE; then
            echo "error: BiteAPIBase in App/project.yml is still the placeholder. Deploy backend/ and set the worker URL before a Release build."
            exit 1
          fi
    info:
      path: BiteWindow/Info.plist
      properties:
        CFBundleDisplayName: BiteWindow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.dautovri.bitewindow.refresh
        NSMotionUsageDescription: Reads your phone's barometer to track the live pressure trend at your spot.
        # Weather cache worker (see backend/). Leave the placeholder to run on sample weather.
        BiteAPIBase: https://REPLACE.workers.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dautovri.bitewindow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
