name: BiteWindow
options:
  bundleIdPrefix: com.dautovri
  deploymentTarget:
    iOS: "17.0"
packages:
  BiteCore:
    path: ..
targets:
  BiteWindow:
    type: application
    platform: iOS
    sources:
      - BiteWindow
    dependencies:
      - package: BiteCore
    info:
      path: BiteWindow/Info.plist
      properties:
        CFBundleDisplayName: BiteWindow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: Reads your phone's barometer to track the live pressure trend at your spot.
        # Weather cache worker (see backend/). Leave the placeholder to run on sample weather.
        BiteAPIBase: https://REPLACE.workers.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dautovri.bitewindow
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
