name: BiteWindow
options:
  bundleIdPrefix: com.dautovri
  deploymentTarget:
    iOS: "17.0"
packages:
  BiteCore:
    path: ..
targets:
  BiteWindow:
    type: application
    platform: iOS
    # receipts/: local tool logs that must never ship in the bundle.
    sources:
      - path: BiteWindow
        excludes: ["receipts/**", "**/receipts.jsonl"]
      # Types the app and the widget extension both compile.
      - path: Shared
    dependencies:
      - package: BiteCore
      - target: BiteWidgets
    # The app writes the widget snapshot into the shared group folder.
    entitlements:
      path: BiteWindow/BiteWindow.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dautovri.bitecurve]
    scheme:
      testTargets: [BiteWindowTests]
      storeKitConfiguration: BiteWindow.storekit
    preBuildScripts:
      - name: Block release builds on sample weather
        basedOnDependencyAnalysis: false
        script: |
          # Debug runs on sample weather; a Release build (archive) must point at the deployed worker.
          if [ "$CONFIGURATION" = "Release" ] && /usr/libexec/PlistBuddy -c "Print :BiteAPIBase" "$SRCROOT/BiteWindow/Info.plist" | grep -q REPLACE; then
            echo "error: BiteAPIBase in App/project.yml is still the placeholder. Deploy backend/ and set the worker URL before a Release build."
            exit 1
          fi
    info:
      path: BiteWindow/Info.plist
      properties:
        CFBundleDisplayName: BiteCurve
        # From the build settings below, so one place sets the version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.dautovri.bitecurve.refresh
        NSMotionUsageDescription: Reads your phone's barometer to track the live pressure trend at your spot.
        NSLocationWhenInUseUsageDescription: Centres the map on where you are when you tap the location button. Your location stays on your iPhone.
        # Weather cache worker (see backend/). Set to a URL containing REPLACE to run on sample weather.
        BiteAPIBase: https://bitewindow-wx.dautov.workers.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dautovri.bitecurve
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
  # Home and lock screen widgets. They read the snapshot the app writes; no scoring, no network.
  BiteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BiteWidgets
      - path: Shared
    info:
      path: BiteWidgets/Info.plist
      properties:
        CFBundleDisplayName: BiteCurve
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BiteWidgets/BiteWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dautovri.bitecurve]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dautovri.bitecurve.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  BiteWindowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BiteWindowTests
      # The local store the purchase tests buy from.
      - path: BiteWindow.storekit
        buildPhase: resources
    dependencies:
      - target: BiteWindow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dautovri.bitecurve.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BiteWindow.app/BiteWindow"
        BUNDLE_LOADER: "$(TEST_HOST)"
