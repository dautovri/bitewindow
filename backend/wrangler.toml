name = "bitewindow-wx"
main = "src/index.ts"
compatibility_date = "2026-10-01"
account_id = "c9bf1ac36bfc945e9deb740689086223"

[[kv_namespaces]]
binding = "WX_CACHE"
id = "430a4ab434d74c16bce881ed7091d722"

[vars]
WEATHERKIT_TEAM_ID = "27EZNUVV57"
WEATHERKIT_SERVICE_ID = "com.dautovri.bitewindow.weatherkit"
WEATHERKIT_KEY_ID = "XBFDGDBMD6"

# Secret: wrangler secret put WEATHERKIT_PRIVATE_KEY < AuthKey_XBFDGDBMD6.p8
# (shared WeatherKit key, kept at ~/.config/weatherkit/; account limit allows no more keys)

# Per-IP limit on cache misses (each costs a WeatherKit call or NOAA requests).
# 60 per minute is far above one app's needs: a miss happens once per spot per hour.
[[ratelimits]]
name = "UPSTREAM_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
