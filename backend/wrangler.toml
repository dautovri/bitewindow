name = "bitewindow-wx"
main = "src/entry.ts"
compatibility_date = "2026-10-01"
account_id = "c9bf1ac36bfc945e9deb740689086223"

[[kv_namespaces]]
binding = "WX_CACHE"
id = "430a4ab434d74c16bce881ed7091d722"

[vars]
WEATHERKIT_TEAM_ID = "27EZNUVV57"
WEATHERKIT_SERVICE_ID = "com.dautovri.bitewindow.weatherkit"
WEATHERKIT_KEY_ID = "XBFDGDBMD6"
# WeatherKit calls per UTC day across all clients (src/budget.ts). The 500k/month allowance is
# shared with other apps (Houby ~20k/month); 5000/day is ~150k/month.
DAILY_WEATHERKIT_BUDGET = "5000"
# The forecast web pages' own share (decided 2026-11-22), reached only through WebForecast.
WEB_DAILY_WEATHERKIT_BUDGET = "1500"

# Secret: wrangler secret put WEATHERKIT_PRIVATE_KEY < AuthKey_XBFDGDBMD6.p8
# (shared WeatherKit key, kept at ~/.config/weatherkit/; account limit allows no more keys)

# Per-IP limit on cache misses (each costs a WeatherKit call or NOAA requests).
# 60 per minute is far above one app's needs: a miss happens once per spot per hour.
[[ratelimits]]
name = "UPSTREAM_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Opt-in shared trips (src/trip.ts). Schema: wrangler d1 execute bitecurve-trips --remote --file schema.sql
# Export for a fit: wrangler d1 execute bitecurve-trips --remote --command "SELECT payload FROM trips" --json
[[d1_databases]]
binding = "TRIPS"
database_name = "bitecurve-trips"
database_id = "b19f5ad1-1d56-4d19-a427-caa2124498b9"

# A phone sends a trip when it ends; ten a minute per address is far more than that.
[[ratelimits]]
name = "TRIP_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
