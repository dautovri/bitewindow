name = "bitecurve-web"
main = "src/index.ts"
compatibility_date = "2026-10-01"
account_id = "c9bf1ac36bfc945e9deb740689086223"
workers_dev = false

# The forecast pages live under the existing site; every other path stays with the Pages project.
routes = [
  { pattern = "apps.dautov.dev/bitecurve/fishing", zone_name = "dautov.dev" },
  { pattern = "apps.dautov.dev/bitecurve/fishing/*", zone_name = "dautov.dev" },
]

# Results only (bite windows, sun and moon times, tides, day summaries), the refresh queue and
# the web's WeatherKit counter. R2, not KV: KV allows 1,000 writes a day on the free plan,
# shared with the app backend. Create it and its expiry rule before the first deploy:
#   npx wrangler r2 bucket create bitecurve-web-pages
#   npx wrangler r2 bucket lifecycle add bitecurve-web-pages pages-3-days pages/ --expire-days 3
#   npx wrangler r2 bucket lifecycle add bitecurve-web-pages budget-3-days budget/ --expire-days 3
[[r2_buckets]]
binding = "PAGES"
bucket_name = "bitecurve-web-pages"

# The BiteCurve backend's WebForecast entrypoint (backend/src/web.ts): no per-IP limit and no
# app budget; this worker reserves from its own budget before it asks.
[[services]]
binding = "BACKEND"
service = "bitewindow-wx"
entrypoint = "WebForecast"

# About two refreshes a day for each of the 152 pages, one page per run.
[triggers]
crons = ["*/5 * * * *"]

[vars]
PAGES_PER_RUN = "1"
# The web's share of the account's WeatherKit allowance (decided 2026-11-22).
WEB_DAILY_WEATHERKIT_BUDGET = "1500"
