name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  ios:
    # The app icon is an Icon Composer bundle (AppIcon.icon), which needs Xcode 26 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: App
      - run: >
          xcodebuild -project BiteWindow.xcodeproj -scheme BiteWindow
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
        working-directory: App
      - name: Check bundled localizations
        working-directory: App
        run: |
          app=build/Build/Products/Debug-iphonesimulator/BiteWindow.app
          for l in de nl sv nb da es fr it pt-BR fi pl ru uk tr ja ko zh-Hans; do
            test -f "$app/$l.lproj/Localizable.strings" || { echo "missing $l"; ls "$app"; exit 1; }
          done
          test -f "$app/de.lproj/InfoPlist.strings"
      - name: App unit tests
        working-directory: App
        run: |
          sim=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          xcodebuild -project BiteWindow.xcodeproj -scheme BiteWindow \
            -destination "id=$sim" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO test
